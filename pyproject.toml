[project]
name = "disputes"
version = "0.1.0"
description = "Data Mining hackathon: chargeback win-probability model and an economic decision rule"
requires-python = ">=3.12"
dependencies = [
    "catboost==1.2.10",
    "ipykernel==7.4.0",
    "jinja2>=3.1.6",
    "joblib",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "scipy",
    "threadpoolctl",
]

[dependency-groups]
dev = [
    "jupytext",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
line-length = 130
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]  # notebook sources are the jupytext .py files

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]  # short lambda helpers inside functions

[tool.ruff.lint.per-file-ignores]
# Notebooks: matplotlib.use("Agg") before pyplot; long markdown lines.
"notebooks/*.py" = ["E402", "E501"]
